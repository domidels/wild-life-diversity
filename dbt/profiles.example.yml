# Copy to dbt/profiles.yml (git-ignored) or ~/.dbt/profiles.yml.
# The values are read from environment variables — see .env.example.
wildfire_biodiversity:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: workspace
      schema: wildfire
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4
