# Deploys the Databricks job defined in databricks.yml (ingestion + dbt, monthly schedule),
# once the CI workflow (ci.yml, with its integration tests) has passed on a push to main.
# Repository secrets needed: DATABRICKS_HOST (hostname, no https://), DATABRICKS_TOKEN.
name: Deploy Databricks pipeline

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_now:
        description: Also start a pipeline run after deploying
        type: boolean
        default: false

concurrency:
  group: databricks-deploy

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: https://${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # the commit the CI tested, not whatever main points to now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t prod
      - run: databricks bundle deploy -t prod
      - if: ${{ inputs.run_now }}
        run: databricks bundle run wildfire_pipeline -t prod --no-wait
